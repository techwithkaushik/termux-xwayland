name: XWayland source preflight

on:
  pull_request:
    branches:
      - termux-x11-port
    paths:
      - ".github/workflows/xwayland-preflight.yml"
      - ".github/workflows/xwayland-termux-build.yml"
      - "tools/probe-xwayland-source.sh"
      - "tools/fetch-xwayland-source.sh"
      - "tools/audit-xwayland-meson-options.sh"
      - "tools/build-xwayland-android.sh"
      - "tools/check-xwayland-android-prefix.py"
      - "tools/audit-xwayland-android-stage.py"
      - "tools/generate-android-meson-cross-file.py"
      - "tools/tests/**"
      - "tools/native-transport/**"
      - "docs/XWAYLAND_REPLACEMENT.md"
      - ".gitmodules"
      - "lorie/src/main/cpp/xserver"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwayland-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Validate standalone upstream XWayland source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and nested submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils meson ninja-build pkg-config

      - name: Check shell script syntax
        run: |
          bash -n tools/probe-xwayland-source.sh
          bash -n tools/fetch-xwayland-source.sh
          bash -n tools/audit-xwayland-meson-options.sh
          bash -n tools/build-xwayland-android.sh
          bash tools/build-xwayland-android.sh --help
          python3 -m py_compile tools/generate-android-meson-cross-file.py tools/check-xwayland-android-prefix.py tools/audit-xwayland-android-stage.py tools/tests/test_generate_android_meson_cross_file.py tools/tests/test_check_xwayland_android_prefix.py tools/tests/test_audit_xwayland_android_stage.py
          python3 -m unittest discover -s tools/tests -v
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/tests/test_protocol.cpp \
            -o /tmp/xw11-transport-protocol-test
          /tmp/xw11-transport-protocol-test

      - name: Diagnose legacy X server gitlink (expected migration blocker)
        run: bash tools/probe-xwayland-source.sh --allow-legacy-source

      - name: Fetch pinned official standalone XWayland release
        run: bash tools/fetch-xwayland-source.sh build/third_party

      - name: Verify standalone release source and Meson backend
        run: |
          source_dir=build/third_party/xwayland-24.1.14
          test -f "$source_dir/meson.build"
          test -f "$source_dir/meson_options.txt"
          test -f "$source_dir/hw/xwayland/meson.build"
          grep -Eq "version: ['\"]24.1.14['\"]" "$source_dir/meson.build"
          printf 'Validated upstream XWayland source: '
          grep -E "version: ['\"]24.1.14['\"]" "$source_dir/meson.build" | head -n 1

      - name: Audit Termux Meson option compatibility
        run: bash tools/audit-xwayland-meson-options.sh build/third_party/xwayland-24.1.14

      - name: Report host dependency availability (informational)
        run: bash tools/probe-xwayland-source.sh --host-deps-only
