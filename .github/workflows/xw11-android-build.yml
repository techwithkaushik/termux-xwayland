name: Termux-XW11 unified CI

on:
  pull_request:
    branches:
      - termux-x11-port
  push:
    branches:
      - xwayland/replace-xorg
    paths:
      - ".github/workflows/**"
      - "tools/**"
      - "docs/XWAYLAND_REPLACEMENT.md"
      - "docs/NATIVE_PRESENTATION_INPUT_CONTRACT.md"
      - ".gitmodules"
      - "lorie/**"
      - "lorie-app/**"
      - "shell-loader/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
  workflow_dispatch:
    inputs:
      build_xwayland:
        description: "Build upstream XWayland Termux package (long-running; required for replacement validation)"
        type: boolean
        required: true
        default: true
      arch:
        description: "Termux target architecture for optional XWayland package build"
        type: choice
        required: true
        default: arm
        options:
          - arm
          - aarch64
      force_dependencies:
        description: "Force rebuilding all XWayland dependency packages (very slow)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: xw11-unified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Validate XWayland source and native transport
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install host inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils meson ninja-build pkg-config weston xwayland x11-utils xterm xfonts-base

      - name: Validate scripts, Python tools and native transport
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/probe-xwayland-source.sh
          bash -n tools/fetch-xwayland-source.sh
          bash -n tools/audit-xwayland-meson-options.sh
          bash -n tools/build-xwayland-android.sh
          bash -n tools/probe-android-buffer-transport.sh
          bash -n tools/test-weston-xwayland-runtime.sh
          bash -n tools/run-xw11-acceptance.sh
          bash -n tools/test-existing-xwayland-display.sh
          bash -n tools/run-android-egl-probe.sh
          bash -n tools/run-android-presenter-probe.sh
          # Exercise the real Weston -> XWayland -> X11-client startup path on CI.
          # This is a headless protocol smoke test, not Android Surface/GPU validation.
          PREFIX=/usr TMPDIR=/tmp HOME="$RUNNER_TEMP" bash tools/test-weston-xwayland-runtime.sh --headless
          bash -n shell-loader/scripts/termux-xw11-wayland.in
          grep -Fq 'LorieView.this.surfaceCreated(mNativeContext)' lorie/src/main/java/com/termux/x11/LorieView.java
          grep -Fq '{"surfaceCreated", "(J)V"' lorie/src/main/cpp/lorie/activity.cpp
          grep -Fq 'xw11_surface_generation.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'xw11_input_event.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'xw11_input_queue.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'xw11_input_transport.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'xw11_input_receiver.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'xw11_input_dispatcher.cpp' lorie/src/main/cpp/recipes/xserver.cmake
          grep -Fq 'Xw11NativeSurfaceView' lorie/src/main/java/com/termux/x11/Xw11NativeSurfaceView.java
          grep -Fq 'onGenericMotionEvent' lorie/src/main/java/com/termux/x11/Xw11NativeSurfaceView.java
          grep -Fq 'MotionEvent.ACTION_BUTTON_PRESS' lorie/src/main/java/com/termux/x11/Xw11NativeSurfaceView.java
          grep -Fq 'MotionEvent.ACTION_BUTTON_RELEASE' lorie/src/main/java/com/termux/x11/Xw11NativeSurfaceView.java
          grep -Fq 'nativeAttachSurface' lorie/src/main/cpp/lorie/activity.cpp
          grep -Fq 'xw11_presenter_set_window' lorie/src/main/cpp/lorie/activity.cpp
          grep -Fq 'nativePresentRgbaFrame' lorie/src/main/cpp/lorie/activity.cpp
          grep -Fq 'nativePresentRgbaFrame' lorie/src/main/java/com/termux/x11/Xw11NativeSurfaceView.java
          grep -Fq 'xw11_presenter_present_rgba8888' lorie/src/main/cpp/lorie/activity.cpp
          bash tools/build-xwayland-android.sh --help
          python3 -m py_compile tools/generate-android-meson-cross-file.py tools/check-xwayland-android-prefix.py tools/audit-xwayland-android-stage.py tools/tests/test_generate_android_meson_cross_file.py tools/tests/test_check_xwayland_android_prefix.py tools/tests/test_audit_xwayland_android_stage.py tools/tests/test_android_graphics_probe.py tools/tests/test_xwayland_runtime_script.py
          python3 -m unittest discover -s tools/tests -v
          python3 tools/tests/test_android_graphics_probe.py
          # Prove the portable native transport builds and tests without the legacy X.Org graph.
          cmake -S tools/native-transport -B /tmp/xw11-native-transport-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/xw11-native-transport-build --parallel 2
          ctest --test-dir /tmp/xw11-native-transport-build --output-on-failure
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/tests/test_protocol.cpp \
            -o /tmp/xw11-transport-protocol-test
          /tmp/xw11-transport-protocol-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/xw11_transport_io.cpp \
            tools/native-transport/tests/test_transport_io.cpp \
            -o /tmp/xw11-transport-io-test
          /tmp/xw11-transport-io-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_fd_passing.cpp \
            tools/native-transport/tests/test_fd_passing.cpp \
            -o /tmp/xw11-fd-passing-test
          /tmp/xw11-fd-passing-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_surface_generation.cpp \
            tools/native-transport/tests/test_surface_generation.cpp \
            -o /tmp/xw11-surface-generation-test
          /tmp/xw11-surface-generation-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_buffer_descriptor.cpp \
            tools/native-transport/tests/test_buffer_descriptor.cpp \
            -o /tmp/xw11-buffer-descriptor-test
          /tmp/xw11-buffer-descriptor-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_buffer_registry.cpp \
            tools/native-transport/tests/test_buffer_registry.cpp \
            -o /tmp/xw11-buffer-registry-test
          /tmp/xw11-buffer-registry-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_input_transform.cpp \
            tools/native-transport/tests/test_input_transform.cpp \
            -o /tmp/xw11-input-transform-test
          /tmp/xw11-input-transform-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Itools/native-transport \
            tools/native-transport/xw11_input_event.cpp \
            tools/native-transport/tests/test_input_event.cpp \
            -o /tmp/xw11-input-event-test
          /tmp/xw11-input-event-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -pthread -Itools/native-transport \
            tools/native-transport/xw11_input_event.cpp \
            tools/native-transport/xw11_input_queue.cpp \
            tools/native-transport/tests/test_input_queue.cpp \
            -o /tmp/xw11-input-queue-test
          /tmp/xw11-input-queue-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/xw11_transport_io.cpp \
            tools/native-transport/xw11_input_event.cpp \
            tools/native-transport/xw11_input_transport.cpp \
            tools/native-transport/tests/test_input_transport.cpp \
            -o /tmp/xw11-input-transport-test
          /tmp/xw11-input-transport-test
          c++ -std=c++17 -Wall -Wextra -Werror -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/xw11_transport_io.cpp \
            tools/native-transport/xw11_input_event.cpp \
            tools/native-transport/xw11_input_receiver.cpp \
            tools/native-transport/tests/test_input_receiver.cpp \
            -o /tmp/xw11-input-receiver-test
          /tmp/xw11-input-receiver-test
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -Itools/native-transport \
            tools/native-transport/xw11_transport_protocol.cpp \
            tools/native-transport/xw11_transport_io.cpp \
            tools/native-transport/xw11_input_event.cpp \
            tools/native-transport/xw11_input_queue.cpp \
            tools/native-transport/xw11_input_transport.cpp \
            tools/native-transport/xw11_input_dispatcher.cpp \
            tools/native-transport/tests/test_input_dispatcher.cpp \
            -o /tmp/xw11-input-dispatcher-test
          /tmp/xw11-input-dispatcher-test

      - name: Diagnose legacy X server gitlink
        run: bash tools/probe-xwayland-source.sh --allow-legacy-source

      - name: Fetch pinned upstream XWayland release
        run: bash tools/fetch-xwayland-source.sh build/third_party

      - name: Verify XWayland source and audit Termux Meson options
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir=build/third_party/xwayland-24.1.14
          test -f "$source_dir/meson.build"
          test -f "$source_dir/meson_options.txt"
          test -f "$source_dir/hw/xwayland/meson.build"
          grep -Eq "version: ['\"]24.1.14['\"]" "$source_dir/meson.build"
          bash tools/audit-xwayland-meson-options.sh "$source_dir"
          bash tools/probe-xwayland-source.sh --host-deps-only

  build-apks:
    name: Build XW11 APKs and launcher packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-xw11-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-xw11-gradle-

      - name: Build main APK, loader APK and companion package
        run: ./gradlew --no-daemon assembleDebug

      - name: Validate Debian launcher package
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(shell-loader/build/outputs/companion/termux-xw11-*-all.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "ERROR: expected exactly one XW11 .deb package; found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Package)" = "termux-xw11-nightly"
          test "$(dpkg-deb -f "$package" Architecture)" = "all"
          dpkg-deb --info "$package"
          listing="$(dpkg-deb --contents "$package")"
          grep -Fq '/bin/termux-xw11' <<<"$listing"
          grep -Fq '/bin/termux-xw11-preference' <<<"$listing"
          grep -Fq '/bin/termux-xw11-wayland' <<<"$listing"
          grep -Fq '/libexec/termux-xw11/loader.apk' <<<"$listing"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$package" "$tmp"
          test -x "$tmp/data/data/com.termux/files/usr/bin/termux-xw11"
          test -x "$tmp/data/data/com.termux/files/usr/bin/termux-xw11-preference"
          test -x "$tmp/data/data/com.termux/files/usr/bin/termux-xw11-wayland"
          test -s "$tmp/data/data/com.termux/files/usr/libexec/termux-xw11/loader.apk"
          echo "Validated installable Termux-XW11 companion .deb: $package"
          {
            dpkg-deb -f "$package" Package Version Architecture Depends
            printf "SHA256: "
            sha256sum "$package"
          } | tee shell-loader/build/outputs/companion/termux-xw11-deb-manifest.txt

      - name: Stage only required deliverables
        shell: bash
        run: |
          set -Eeuo pipefail
          out=build/xw11-deliverables
          mkdir -p "$out"
          cp lorie-app/build/outputs/apk/standalone/debug/termux-xw11-universal-debug.apk "$out/termux-xw11.apk"
          cp shell-loader/build/outputs/companion/termux-xw11-*-all.deb "$out/termux-xw11.deb"
          cp shell-loader/build/outputs/companion/termux-xw11-deb-manifest.txt "$out/termux-xw11-deb-manifest.txt"
          (
            cd "$out"
            sha256sum termux-xw11.apk termux-xw11.deb termux-xw11-deb-manifest.txt > SHA256SUMS
          )
          ls -lh "$out"

      - name: Upload required deliverables (single artifact)
        uses: actions/upload-artifact@v4
        with:
          name: termux-xw11-required
          if-no-files-found: error
          path: build/xw11-deliverables/*
          retention-days: 14

  build-xwayland:
    name: Build upstream XWayland Termux package
    if: github.event_name == 'workflow_dispatch' && inputs.build_xwayland
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned official Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: facb27bc85ef36fd1120d4ae990fbd59e134fc61
          path: termux-packages
          fetch-depth: 1

      - name: Verify official XWayland recipe baseline
        working-directory: termux-packages
        run: |
          test -f x11-packages/xwayland/build.sh
          grep -q 'TERMUX_PKG_VERSION="24.1.14"' x11-packages/xwayland/build.sh
          grep -q 'TERMUX_PKG_SHA256=4eb6b98d678299a4b96138d886345b294130695760345ef84596225a8224078a' x11-packages/xwayland/build.sh
          echo "Using the official Termux XWayland 24.1.14 recipe."

      - name: Build upstream XWayland with official Termux cross-build system
        working-directory: termux-packages
        env:
          TERMUX_ARCH: ${{ inputs.arch || 'arm' }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.force_dependencies }}" == "true" ]]; then
            ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" -F x11-packages/xwayland
          else
            ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" -i -f x11-packages/xwayland
          fi

      - name: Validate XWayland package and write manifest
        working-directory: termux-packages
        env:
          TERMUX_ARCH: ${{ inputs.arch || 'arm' }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(output/xwayland_*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "ERROR: expected exactly one xwayland_*.deb package, found ${#packages[@]}" >&2
            printf 'Found: %s\n' "${packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          actual_arch="$(dpkg-deb -f "$package" Architecture)"
          if [[ "$actual_arch" != "$TERMUX_ARCH" ]]; then
            echo "ERROR: package architecture mismatch: expected $TERMUX_ARCH, got $actual_arch" >&2
            exit 1
          fi
          test "$(dpkg-deb -f "$package" Package)" = "xwayland"
          dpkg-deb --contents "$package" | grep -E "/bin/Xwayland$" >/dev/null
          {
            echo "Package: xwayland"
            echo "Version: $(dpkg-deb -f "$package" Version)"
            echo "Architecture: $actual_arch"
            echo "Workflow target: $TERMUX_ARCH"
            echo "SHA256:"
            sha256sum "$package"
          } > output/xwayland-build-manifest.txt
          cat output/xwayland-build-manifest.txt

      - name: Upload XWayland package
        uses: actions/upload-artifact@v4
        with:
          name: xwayland-termux-${{ inputs.arch || 'arm' }}
          path: |
            termux-packages/output/xwayland_*.deb
            termux-packages/output/xwayland-build-manifest.txt
          if-no-files-found: error
          retention-days: 14
