name: XWayland Android package build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Termux target architecture"
        type: choice
        required: true
        default: arm
        options:
          - arm
          - aarch64
      force_dependencies:
        description: "Force rebuilding all dependency packages (very slow)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: xwayland-termux-build-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build-xwayland:
    name: Build XWayland for Termux ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout official Termux package recipes and build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
          path: termux-packages
          fetch-depth: 1

      - name: Verify the official XWayland recipe baseline
        working-directory: termux-packages
        run: |
          test -f x11-packages/xwayland/build.sh
          grep -q 'TERMUX_PKG_VERSION="24.1.14"' x11-packages/xwayland/build.sh
          grep -q 'TERMUX_PKG_SHA256=4eb6b98d678299a4b96138d886345b294130695760345ef84596225a8224078a' x11-packages/xwayland/build.sh
          echo "Using the official Termux XWayland 24.1.14 recipe."

      - name: Build upstream XWayland with official Termux cross-build system
        working-directory: termux-packages
        env:
          TERMUX_ARCH: ${{ inputs.arch }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.force_dependencies }}" == "true" ]]; then
            ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" -F x11-packages/xwayland
          else
            # Reuse published Termux dependency packages; build XWayland itself from source.
            ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" -i -f x11-packages/xwayland
          fi

      - name: Validate XWayland package and write build manifest
        working-directory: termux-packages
        env:
          TERMUX_ARCH: ${{ inputs.arch }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(output/xwayland_*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "ERROR: expected exactly one xwayland_*.deb package, found ${#packages[@]}" >&2
            printf 'Found: %s\\n' "${packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          expected_arch="$TERMUX_ARCH"
          actual_arch="$(dpkg-deb -f "$package" Architecture)"
          if [[ "$actual_arch" != "$expected_arch" ]]; then
            echo "ERROR: package architecture mismatch: expected $expected_arch, got $actual_arch" >&2
            exit 1
          fi

          package_version="$(dpkg-deb -f "$package" Version)"
          package_name="$(dpkg-deb -f "$package" Package)"
          [[ "$package_name" == "xwayland" ]] || {
            echo "ERROR: unexpected package name: $package_name" >&2
            exit 1
          }
          dpkg-deb --contents "$package" | grep -Eq '/bin/Xwayland || {
            echo "ERROR: package does not contain the Xwayland executable" >&2
            exit 1
          }

          {
            echo "Package: $package_name"
            echo "Version: $package_version"
            echo "Architecture: $actual_arch"
            echo "Workflow target: $TERMUX_ARCH"
            echo "SHA256:"
            sha256sum "$package"
          } > output/xwayland-build-manifest.txt
          cat output/xwayland-build-manifest.txt

      - name: Upload built XWayland package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xwayland-termux-${{ inputs.arch }}
          path: |
            termux-packages/output/xwayland_*.deb
            termux-packages/output/xwayland-build-manifest.txt
          if-no-files-found: error
          retention-days: 14
