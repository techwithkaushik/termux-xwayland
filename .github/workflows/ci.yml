name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "android-app/**"
      - "termux-package/**"
      - "docs/**"
      - "native/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "android-app/**"
      - "termux-package/**"
      - "docs/**"
      - "native/**"
      - "tools/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare shared development signing keystore
        id: keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE || secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_KEY_STORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          mkdir -p build/signing
          keystore_path="$GITHUB_WORKSPACE/build/signing/dev-keystore.jks"
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          if ! keytool -list -keystore "$keystore_path" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Check the base64 keystore secret, store password, and key alias."
            exit 1
          fi
          umask 077
          cat > build/signing/key.properties <<EOF
          storeFile=$keystore_path
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          storePassword=$SIGNING_STORE_PASSWORD
          EOF
          chmod 600 "$keystore_path" build/signing/key.properties
          echo "filePath=$keystore_path" >> "$GITHUB_OUTPUT"
          echo "Shared development keystore prepared and validated."
      - name: Test and assemble the display-host APK
        env:
          SIGNING_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache clean
          gradle --no-daemon --no-build-cache :android-app:testDebugUnitTest :android-app:assembleDebug
      - name: Build Termux app_process socket client DEX
        run: bash tools/build-termux-socket-client.sh dist/termux-socket-client
      - name: Upload Termux socket client DEX
        uses: actions/upload-artifact@v4
        with:
          name: termux-xwayland-socket-client-dex
          path: dist/termux-socket-client/bridge-client.dex
          if-no-files-found: error
      - name: Upload display host APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-xwayland-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  native-scaffold:
    needs: android
    name: Native protocol and scaffold checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termux-xwayland-socket-client-dex
          path: dist/termux-socket-client
      - name: Stage socket client into the Termux DEB tree
        run: |
          set -euo pipefail
          install -D -m 0644 dist/termux-socket-client/bridge-client.dex termux-package/data/data/com.termux/files/usr/share/termux-xwayland/bridge-client.dex
      - name: Check repository structure
        run: bash tools/check-scaffold.sh
      - name: Python diagnostic syntax and protocol validation tests
        run: |
          python3 -m py_compile tools/tcp-loopback-probe.py tools/tcp-framed-protocol-probe.py tools/test-tcp-framed-protocol-probe.py
          python3 tools/test-tcp-framed-protocol-probe.py
      - name: Test Termux DEB companion package
        run: bash tools/test-termux-package.sh
      - name: Build Termux DEB release artifact
        run: bash termux-package/build-deb.sh dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format check
        working-directory: native/compositor
        run: cargo fmt --check
      - name: Rust unit tests
        working-directory: native/compositor
        run: cargo test
      - name: Rust check
        working-directory: native/compositor
        run: cargo check
      - name: Upload Termux DEB package
        uses: actions/upload-artifact@v4
        with:
          name: termux-xwayland-bridge-deb
          path: dist/termux-xwayland-bridge_0.3.0_all.deb
          if-no-files-found: error
          retention-days: 14
